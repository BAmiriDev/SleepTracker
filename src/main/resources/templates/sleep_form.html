<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sleep Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-body">
            <h2 class="mb-4 text-center" th:text="${sleepEntry.id != null} ? 'Edit Sleep Entry' : 'New Sleep Entry'"></h2>

            <form th:action="@{${sleepEntry.id != null} ? '/sleep/update/' + ${sleepEntry.id} : '/sleep'}"
                  th:object="${sleepEntry}" method="post">

                <input type="hidden" th:if="${sleepEntry.id != null}" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" th:field="*{date}" class="form-control" required>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Sleep Time</label>
                        <input type="time" th:field="*{sleepTime}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Wake Time</label>
                        <input type="time" th:field="*{wakeTime}" class="form-control" required>
                    </div>
                </div>

                <div class="my-3">
                    <label class="form-label">Quality</label>
                    <select th:field="*{quality}" class="form-select" required>
                        <option value="" disabled
                                th:selected="${sleepEntry.quality == null}">Select one</option>
                        <option value="Excellent">Excellent</option>
                        <option value="Good">Good</option>
                        <option value="Okay">Okay</option>
                        <option value="Poor">Poor</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Notes</label>
                    <textarea th:field="*{notes}" class="form-control" rows="2"
                              placeholder="Optional..."></textarea>
                </div>

                <div class="d-flex justify-content-end">
                    <a th:href="@{/sleep}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
